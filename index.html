<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shastha Guppy Farm</title>
<style>
  :root{--card:rgba(6,50,75,.55);--accent:#19c3b1;--text:#eafcff;--muted:#cdeaf2;--warn:#ffb347}
  *{box-sizing:border-box;margin:0;padding:0;font-family:system-ui,Segoe UI,Arial,sans-serif}
  body{background:#0f78b8;color:var(--text);min-height:100vh}

  /* ===== UNDERWATER SCENE (all code, no images) ===== */
  #sea{position:fixed;inset:0;overflow:hidden;z-index:0;pointer-events:none;
    background:linear-gradient(180deg,#7fe0f5 0%,#27a4dc 18%,#0f78b8 50%,#08507f 80%,#053553 100%)}
  .rays{position:absolute;inset:-10% -20% 20% -20%;
    background:repeating-linear-gradient(100deg,transparent 0 50px,rgba(255,255,255,.16) 85px,transparent 130px 190px);
    -webkit-mask-image:linear-gradient(#000,transparent 85%);mask-image:linear-gradient(#000,transparent 85%);
    animation:rays 10s ease-in-out infinite alternate}
  .rays.r2{background-size:130% 100%;opacity:.7;animation-duration:15s;animation-direction:alternate-reverse}
  @keyframes rays{from{transform:translateX(-5%);opacity:.45}to{transform:translateX(5%);opacity:1}}
  .caustic{position:absolute;left:-10%;right:-10%;bottom:0;height:35%;opacity:.5;
    background:repeating-radial-gradient(ellipse at 30% 100%,rgba(255,255,255,.14) 0 5px,transparent 12px 40px);
    animation:caus 7s ease-in-out infinite alternate}
  @keyframes caus{from{transform:translateX(-4%) scaleY(1)}to{transform:translateX(4%) scaleY(1.2)}}
  .floor{position:absolute;left:0;right:0;bottom:0;height:9vh;background:linear-gradient(transparent,#07304a 70%)}
  .rock{position:absolute;bottom:-2vh;background:#1c4560;border-radius:50% 50% 0 0}

  /* plants */
  .blade{position:absolute;bottom:0;transform-origin:50% 100%;animation:sway var(--d) ease-in-out infinite alternate;animation-delay:var(--dl)}
  @keyframes sway{from{transform:rotate(-5deg) skewX(-4deg)}to{transform:rotate(5deg) skewX(4deg)}}

  /* jellyfish: float upwards */
  .jelly{position:absolute;bottom:-220px;animation:jrise var(--t) linear infinite;animation-delay:var(--dl)}
  @keyframes jrise{0%{transform:translate(0,0)}25%{transform:translate(25px,-33vh)}50%{transform:translate(-20px,-66vh)}75%{transform:translate(25px,-99vh)}100%{transform:translate(0,-135vh)}}
  .jelly svg{display:block;overflow:visible;animation:tilt 5s ease-in-out infinite alternate}
  @keyframes tilt{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
  .bell{transform-box:fill-box;transform-origin:50% 0;animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{transform:scale(1.05,.88)}50%{transform:scale(.94,1.08)}}
  .tent{transform-box:fill-box;transform-origin:50% 0;animation:wave 2.4s ease-in-out infinite alternate}
  @keyframes wave{from{transform:skewX(-7deg) scaleY(.92)}to{transform:skewX(7deg) scaleY(1.06)}}

  /* fish schools: always swim head-first */
  .school{position:absolute;left:0;animation:var(--dir) var(--t) linear infinite;animation-delay:var(--dl)}
  @keyframes swimR{from{transform:translateX(-320px)}to{transform:translateX(calc(100vw + 120px))}}
  @keyframes swimL{from{transform:translateX(calc(100vw + 120px))}to{transform:translateX(-320px)}}
  .sin{position:relative;animation:bob 3.5s ease-in-out infinite alternate}
  @keyframes bob{from{transform:translateY(-10px)}to{transform:translateY(12px)}}
  .fish{position:absolute;overflow:visible;animation:fbob 1.8s ease-in-out infinite alternate;animation-delay:var(--fd)}
  @keyframes fbob{from{margin-top:-3px}to{margin-top:3px}}
  .tail{transform-box:fill-box;transform-origin:100% 50%;animation:wag .35s ease-in-out infinite alternate}
  @keyframes wag{from{transform:rotate(-16deg)}to{transform:rotate(16deg)}}

  /* bubbles */
  .bub{position:absolute;bottom:-30px;border-radius:50%;border:1px solid rgba(255,255,255,.7);
    background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.55),rgba(255,255,255,.05));animation:rise linear infinite}
  @keyframes rise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}30%{transform:translate(14px,-30vh)}60%{transform:translate(-12px,-65vh)}100%{transform:translate(8px,-112vh);opacity:.2}}
  @media (prefers-reduced-motion:reduce){#sea *{animation:none!important}}

  /* ===== PAGES ===== */
  .screen{display:none;min-height:100vh;padding:20px;position:relative;z-index:1;text-shadow:0 1px 6px rgba(0,40,70,.6)}
  .screen.active{display:block}
  #home.active{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:18px}
  .logo{width:min(280px,70vw);height:min(280px,70vw);border-radius:50%;object-fit:cover;border:4px solid #e8c877;box-shadow:0 0 30px rgba(232,200,119,.4)}
  .hello{font-size:2.2rem}
  .welcome{font-size:1.5rem;max-width:420px}
  p.sub{color:var(--muted)}
  button{cursor:pointer;border:none;border-radius:10px;font-size:1rem;padding:12px 24px;background:var(--accent);color:#04202b;font-weight:700;text-shadow:none}
  button:disabled{background:#476a75;color:#9db;cursor:not-allowed}
  header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;gap:10px}
  header h2{font-size:1.25rem}
  .sbar,.stick{position:sticky;top:0;z-index:15;margin:0 -20px 16px;padding:10px 20px;background:#0b4f7c;box-shadow:0 4px 12px rgba(0,0,0,.28);transform:translateZ(0);-webkit-transform:translateZ(0)}
  .stick{padding-bottom:12px}
  .stick header{margin:0}
  .stick .ptitle{margin-bottom:8px}
  body.admin .sbar,body.admin .stick{top:76px}
  .sbar .back{font-size:1.3rem;padding:8px 14px;line-height:1}
  .sbar input[type=search]{flex:1;min-width:0;padding:11px 16px;border-radius:22px;border:none;font-size:1rem;background:#fff;color:#04202b;text-shadow:none}
  .ptitle{text-align:center;font-size:1.4rem;margin-bottom:12px}
  .back{background:rgba(6,50,75,.45);color:var(--text);padding:8px 12px;border:1px solid var(--muted)}
  .cartbtn{position:relative;background:var(--card);color:var(--text);padding:10px 14px}
  .badge{position:absolute;top:-6px;right:-6px;background:#ff4d6d;color:#fff;border-radius:50%;min-width:22px;height:22px;font-size:.8rem;display:flex;align-items:center;justify-content:center}
  .boxes{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:16px;max-width:600px;margin:40px auto}
  .mini-logo{width:48px;height:48px;border-radius:50%;object-fit:cover;border:2px solid #e8c877;cursor:pointer;box-shadow:0 0 12px rgba(232,200,119,.4)}
  .box{background:var(--card);border-radius:16px;padding:32px 12px;text-align:center;font-size:1.2rem;cursor:pointer}
  .box:hover{border-color:var(--accent)}
  .box span{display:block;font-size:3rem;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:16px;max-width:900px;margin:auto}
  .card{background:var(--card);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
  .card .img{height:110px;display:flex;align-items:center;justify-content:center;font-size:3rem}
  .card .img img{width:100%;height:100%;object-fit:cover}
  .card .info{padding:12px;display:flex;flex-direction:column;gap:8px;flex:1}
  .price{color:#7ff5e6;font-weight:700}
  .qty{display:flex;align-items:center;justify-content:space-between}
  .qty button{padding:6px 14px;font-size:1.1rem}
  .row{display:flex;justify-content:space-between;align-items:center;background:var(--card);padding:12px;border-radius:12px;margin-bottom:10px;gap:10px}
  .cart-wrap{max-width:600px;margin:auto}
  .warn{background:#4a3410;color:var(--warn);padding:12px;border-radius:10px;margin:12px 0;display:none}
  .total{font-size:1.2rem;font-weight:700;margin:14px 0;text-align:right}
  #sendBtn{width:100%;background:#25d366;color:#04301a}
  #sendBtn:disabled{background:#476a75;color:#9db}
  .card,.row,.box,.cartbtn{backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.2)}
  .card{position:relative}.card.oos .img{opacity:.4}
  .oos-tag{position:absolute;top:8px;left:8px;background:#ff4d6d;color:#fff;padding:3px 8px;border-radius:6px;font-size:.75rem;font-weight:700;z-index:2}
  .card .img video{width:100%;height:100%;object-fit:cover}
  .adm{padding:6px 8px;font-size:.78rem;background:#ffd166;margin-top:4px}
  #adminbar{display:none;position:fixed;top:0;left:0;right:0;z-index:20;background:#ffd166;color:#222;padding:8px 10px;gap:6px;align-items:center;flex-wrap:wrap;font-size:.85rem;font-weight:700;text-shadow:none}
  #adminbar button{padding:6px 10px;font-size:.8rem;background:#222;color:#ffd166}
  body.admin #adminbar{display:flex}body.admin .screen{padding-top:76px}
  .modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center;padding:16px}.modal.open{display:flex}
  .mbox{background:#0a3d5c;border-radius:14px;padding:18px;width:100%;max-width:380px;display:flex;flex-direction:column;gap:10px;max-height:90vh;overflow:auto}
  .mbox input:not([type=checkbox]),.mbox select{padding:10px;border-radius:8px;border:none;font-size:1rem;width:100%}
  .mrow{display:flex;gap:8px}.mrow button{flex:1}
  .lane{display:none;position:absolute;left:0;right:0;top:0;overflow:hidden;cursor:pointer;z-index:5;background:linear-gradient(90deg,#ffb347,#ffd166,#ffb347);color:#4a2b00;text-shadow:none;font-weight:700;font-size:.95rem;border-bottom:2px solid #e8a317;box-shadow:0 2px 8px rgba(0,0,0,.25)}
  body.admin .lane{top:76px}
  .mq{display:flex;width:max-content;padding:9px 0;animation:mqk 40s linear infinite}
  .mqh{display:flex;flex:none}
  .mqs{white-space:nowrap;padding-right:60px}
  @keyframes mqk{from{transform:translateX(-50%)}to{transform:translateX(0)}}
  .lane.on{display:block}
  .tow{pointer-events:auto;cursor:pointer;position:absolute;left:0;top:8px;animation:tow 20s linear infinite}
  @keyframes tow{from{transform:translateX(-100%)}to{transform:translateX(100vw)}}
  .tow-in{display:flex;align-items:center;animation:bob 3s ease-in-out infinite alternate}
  .ban{width:max-content;max-width:250px;padding:8px 14px 8px 22px;background:#fff3c4;color:#7a3b00;text-shadow:none;font-size:.78rem;line-height:1.3;text-align:center;
    clip-path:polygon(0 0,100% 0,100% 100%,0 100%,14px 50%);border-right:3px solid #e8a317;box-shadow:0 2px 8px rgba(0,0,0,.3)}
  .ban b{display:block;font-size:.95rem;color:#c2410c;letter-spacing:.5px}
  .rope{width:30px;height:2px;background:rgba(255,255,255,.85)}
  .card{cursor:pointer}
  .dwrap{max-width:520px;margin:auto}
  .dmedia{width:100%;max-height:340px;object-fit:cover;border-radius:14px;margin-bottom:10px;display:block;background:rgba(6,50,75,.4)}
  .dnone{height:200px;display:flex;align-items:center;justify-content:center;font-size:5rem}
  .cform{display:none;margin-top:18px}
  .cform h3{margin-bottom:10px}
  .dnote{background:rgba(255,243,196,.95);color:#7a3b00;text-shadow:none;padding:10px 12px;border-radius:10px;margin-bottom:14px;font-size:.92rem;line-height:1.35;border-left:4px solid #e8a317}
  .cform label{display:block;font-size:.9rem;margin:6px 0 4px}
  .cform input,.cform textarea{width:100%;padding:12px;border-radius:10px;border:none;font-size:1rem;margin-bottom:6px;background:#fff;color:#04202b;text-shadow:none;font-family:inherit}
  .cform .err{background:#5a1a24;color:#ffb3c0;padding:10px;border-radius:10px;margin:8px 0;display:none}
  .box{position:relative}
  .box.off{opacity:.7}
  .box .tag{position:absolute;top:8px;right:8px;background:#ffb347;color:#4a2b00;font-size:.7rem;font-weight:700;padding:3px 8px;border-radius:6px;text-shadow:none}
  .box .adm{display:block;margin:10px auto 0;font-size:.75rem}
  .social{display:flex;gap:26px;margin-top:34px}
  .social a{display:flex;align-items:center;justify-content:center;transition:transform .2s;filter:drop-shadow(0 1px 3px rgba(0,40,70,.65))}
  .social a:hover{transform:scale(1.15)}
  .social svg{width:34px;height:34px}
  #logoEdit{display:none;margin:0}
  body.admin #logoEdit{display:inline-block}
</style>
</head>
<body>

<div id="adminbar"><span>🔧 Admin mode</span><button onclick="openPanel()">📋 Pick page / item</button><button onclick="editItem(null)">➕ Add item</button><button onclick="editOffer()">🎁 Combo offer</button><button onclick="logout()">Logout</button></div>
<div id="modal" class="modal"><div class="mbox" id="mbox"></div></div>

<!-- UNDERWATER BACKGROUND (built by script at the bottom) -->
<div id="sea">
  <svg width="0" height="0" style="position:absolute"><defs>
    <linearGradient id="jg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".85"/><stop offset="1" stop-color="#bfe9ff" stop-opacity=".45"/></linearGradient>
  </defs></svg>
  <div class="rays"></div><div class="rays r2"></div>
  <div class="caustic"></div>
  <div id="jellies"></div>
  <div id="schools"></div>
  <div class="floor"></div>
  <div class="rock" style="left:-4%;width:30%;height:9vh"></div>
  <div class="rock" style="right:-6%;width:34%;height:11vh"></div>
  <div id="plants"></div>
  <div id="bubbles"></div>
</div>

<!-- HOME -->
<div id="home" class="screen active">
  <div class="lane" id="offerLane" onclick="openCombo()"><div class="mq" id="mq"></div></div>
  <img class="logo" src="logo.jpg" alt="Shastha Guppy Farm logo" onclick="logoTap()">
  <button class="adm" id="logoEdit" onclick="editLogo()">✏️ Edit logo</button>
  <h1 class="welcome">Welcome to Shastha Guppy Farm</h1>
  <button onclick="show('categories')">Continue</button>
  <div class="social">
    <a class="ig" href="https://www.instagram.com/shastha_guppy_farm?stkn=YzBpc3h2dmNqZ2Fu" target="_blank" rel="noopener" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><rect x="3.5" y="3.5" width="17" height="17" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.2" cy="6.8" r=".8" fill="#fff"/></svg></a>
    <a class="wa" href="https://wa.me/918088820799" target="_blank" rel="noopener" aria-label="WhatsApp">
      <svg viewBox="0 0 24 24"><path d="M4 20l1.4-4.2A8.5 8.5 0 1 1 8 18.6z" fill="none" stroke="#fff" stroke-width="2" stroke-linejoin="round"/><path d="M9 8.5c0 3.5 3 6.5 6.5 6.5l1-1.6-2-1-.9.8c-1-.4-2-1.4-2.4-2.4l.8-.9-1-2z" fill="#fff"/></svg></a>
    <a class="yt" href="https://youtube.com/@shasthaguppyfarm?si=ED0la7ay45h5jh-z" target="_blank" rel="noopener" aria-label="YouTube">
      <svg viewBox="0 0 24 24"><rect x="2.5" y="6" width="19" height="12" rx="3.5" fill="none" stroke="#fff" stroke-width="2"/><path d="M10 9.2l5 2.8-5 2.8z" fill="#fff"/></svg></a>
  </div>
</div>

<!-- CATEGORIES -->
<div id="categories" class="screen">
  <header class="sbar">
    <img class="mini-logo" src="logo.jpg" alt="Shastha Guppy Farm" onclick="show('home')">
    <h2>What do you need?</h2>
    <button class="cartbtn" onclick="show('cart')">🛒<span class="badge cartcount">0</span></button>
  </header>
  <div class="boxes" id="cats"></div>
</div>

<!-- LIST -->
<div id="list" class="screen">
  <div class="stick">
    <h2 id="listTitle" class="ptitle"></h2>
    <header>
      <button class="back" aria-label="Back" onclick="goBack('categories')">←</button>
      <input id="srch" type="search" placeholder="🔍 Search" oninput="renderGrid()" autocomplete="off">
      <button class="cartbtn" onclick="show('cart')">🛒<span class="badge cartcount">0</span></button>
    </header>
  </div>
  <div class="grid" id="grid"></div>
</div>

<!-- CART -->
<div id="cart" class="screen">
  <header class="sbar">
    <button class="back" aria-label="Back" onclick="goBack('categories')">←</button>
    <h2>Your Cart</h2>
    <span></span>
  </header>
  <div class="cart-wrap">
    <div id="cartItems"></div>
    <div class="warn" id="warn"></div>
    <div class="total" id="total"></div>
    <div class="cform" id="cform">
      <div class="dnote">🚚 <b>Delivery charge:</b> 1 kg delivery charge is ₹250. You can add 3–5 pairs in it.</div>
      <h3>Your details</h3>
      <label for="cName">Name</label><input id="cName" type="text" placeholder="Type your full name" autocomplete="name">
      <label for="cAddr">Address</label><textarea id="cAddr" rows="3" placeholder="House no, street, area, city, state" autocomplete="street-address"></textarea>
      <label for="cPhone">Phone number</label><input id="cPhone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" autocomplete="tel">
      <label for="cPin">Pincode</label><input id="cPin" type="text" inputmode="numeric" maxlength="6" placeholder="6-digit pincode" autocomplete="postal-code">
      <div class="err" id="cErr"></div>
    </div>
    <button id="sendBtn" onclick="sendOrder()">Send order on WhatsApp</button>
  </div>
</div>

<!-- PRODUCT DETAIL -->
<div id="detail" class="screen">
  <header class="sbar"><button class="back" aria-label="Back" onclick="detailBack()">←</button><h2 id="dTitle"></h2>
    <button class="cartbtn" onclick="show('cart')">🛒<span class="badge cartcount">0</span></button></header>
  <div id="dBody"></div>
</div>

<!-- COMBO OFFER -->
<div id="combo" class="screen">
  <header class="sbar"><button class="back" aria-label="Back" onclick="goBack('home')">←</button><h2>🎉 Combo Offer</h2><span></span></header>
  <div class="cart-wrap" id="comboBody"></div>
</div>

<script>
// ====== EDIT THESE ======
const WHATSAPP_NUMBER = "918088820799";
const MIN_PAIRS = 3;
const DELIVERY_CHARGE = 250; // per kg, used for the delivery-discount offer
let PRODUCTS = {
  guppy: [
    {id:"g1", name:"Red Dragon Guppy",    price:150, unit:"pair", image:""},
    {id:"g2", name:"Blue Moscow Guppy",   price:150, unit:"pair", image:""},
    {id:"g3", name:"Albino Full Red",     price:200, unit:"pair", image:""},
    {id:"g4", name:"Black Moscow Guppy",  price:150, unit:"pair", image:""},
    {id:"g5", name:"Cobra Guppy",         price:120, unit:"pair", image:""},
    {id:"g6", name:"Mosaic Guppy",        price:120, unit:"pair", image:""},
    {id:"g7", name:"Yellow Tuxedo Guppy", price:130, unit:"pair", image:""},
    {id:"g8", name:"Snakeskin Guppy",     price:130, unit:"pair", image:""}
  ],
  otherfish: [
    {id:"o1", name:"Molly",           price:60,  unit:"pair", image:""},
    {id:"o2", name:"Platy",           price:50,  unit:"pair", image:""},
    {id:"o3", name:"Swordtail",       price:60,  unit:"pair", image:""},
    {id:"o4", name:"Betta",           price:150, unit:"piece", image:""},
    {id:"o5", name:"Goldfish",        price:80,  unit:"piece", image:""},
    {id:"o6", name:"Neon Tetra",      price:40,  unit:"pair", image:""},
    {id:"o7", name:"Angelfish",       price:120, unit:"pair", image:""},
    {id:"o8", name:"Koi Carp",        price:200, unit:"piece", image:""}
  ],
  food: [
    {id:"f1", name:"Micro Pellets 50g",   price:90,  unit:"pack", image:""},
    {id:"f2", name:"Fish Flakes 50g",     price:80,  unit:"pack", image:""},
    {id:"f3", name:"Frozen Bloodworms",   price:120, unit:"pack", image:""},
    {id:"f4", name:"Spirulina Granules",  price:110, unit:"pack", image:""}
  ],
  medicine: [
    {id:"m1", name:"Ich / White Spot Cure",  price:90,  unit:"bottle", image:""},
    {id:"m2", name:"Fungus Cure",            price:90,  unit:"bottle", image:""},
    {id:"m3", name:"Anti-Bacterial Drops",   price:100, unit:"bottle", image:""},
    {id:"m4", name:"Water Conditioner",      price:80,  unit:"bottle", image:""}
  ],
  accessory: [
    {id:"a1", name:"Aquarium Net",           price:40,  unit:"piece", image:""},
    {id:"a2", name:"Air Pump",               price:350, unit:"piece", image:""},
    {id:"a3", name:"Sponge Filter",          price:150, unit:"piece", image:""},
    {id:"a4", name:"Aquarium Heater",        price:450, unit:"piece", image:""}
  ]
};
// ========================

let cart = {}, current = "guppy", comboCart = null;
const TITLES = {guppy:"Guppy Varieties", otherfish:"Other Fishes", food:"Fish Foods", medicine:"Medicines", accessory:"Accessories"};
const EMOJI = {guppy:"🐠", otherfish:"🐟", food:"🍤", medicine:"💊", accessory:"🧰"};
const DEFAULTS = JSON.parse(JSON.stringify(PRODUCTS));
let all = [];
const rebuild = () => { all = Object.entries(PRODUCTS).flatMap(([type,list])=>list.map(p=>({...p,type}))); }; rebuild();
const find = id => all.find(p=>p.id===id);

let curScreen="home";
function show(id,fromPop){
  document.querySelectorAll(".screen").forEach(s=>s.classList.remove("active"));
  document.getElementById(id).classList.add("active");
  if(id==="cart") renderCart();
  window.scrollTo({top:0,left:0,behavior:"instant"});
  if(!fromPop && id!==curScreen) history.pushState({s:id,cur:current,did:detailId,dm:detailMode},"");
  curScreen=id;
}
function goBack(fallback){
  if(history.state && history.state.s && history.state.s!=="home") history.back();
  else show(fallback);
}
window.addEventListener("popstate",e=>{
  const st=e.state||{s:"home"};
  closeModal();
  if(st.s==="list"){current=st.cur||current;document.getElementById("listTitle").textContent=TITLES[current]||"";renderGrid();}

function change(id,d){

function renderCart(){
  const ids=Object.keys(cart), has=ids.length||comboCart, box=document.getElementById("cartItems"),
        warn=document.getElementById("warn"), btn=document.getElementById("sendBtn");
  document.getElementById("cform").style.display=has?"block":"none";

  }
  let h="";
  if(comboCart) h+=`<div class="row"><div><strong>🎉 Combo: ${esc(comboCart.title)}</strong><br><small>${comboCart.lines.map(esc).join("<br>")}</small><br><small>Combo price: ₹${comboCart.price}</small></div><button onclick="removeCombo()">✕</button></div>`;

  }).join("");
  const bn=bonus();
  if(bn){
    if(bn.hit&&bn.hit.free>0){
      const opts=giftOpts(OFFER,bn.hit);
      freePick.length=bn.hit.free;
      for(let i=0;i<bn.hit.free;i++) if(!opts.find(x=>x.k===freePick[i])) freePick[i]=opts.length?opts[0].k:"";
      const sel=opts.length?Array.from({length:bn.hit.free},(_,i)=>`<select onchange="freePick[${i}]=this.value" style="padding:10px;border-radius:8px;border:none;font-size:1rem;width:100%">${opts.map(x=>`<option value="${esc(x.k)}"${freePick[i]===x.k?" selected":""}>${esc(x.label)}</option>`).join("")}</select>`).join(""):`<small>Free gift chosen by the farm</small>`;
      h+=`<div class="row" style="flex-direction:column;align-items:stretch;gap:8px"><strong>🎁 FREE: ${bn.hit.free} pair${bn.hit.free>1?"s":""} (Buy ${bn.hit.buy}+ offer)</strong>${opts.length?`<small>Choose your free gift:</small>`:""}${sel}</div>`;
    }
    if(bn.hit&&bn.hit.del>0) h+=`<div class="row" style="flex-direction:column;align-items:flex-start;gap:4px"><strong>🚚 Delivery discount: ${bn.hit.del}% OFF</strong><small>Delivery charge per kg: <s>₹${DELIVERY_CHARGE}</s> <b>₹${dcharge(bn.hit.del)}</b></small></div>`;
    if(bn.next){
      const parts=[];
      if(bn.next.free>0) parts.push(`${bn.next.free} pair${bn.next.free>1?"s":""} FREE`);
      if(bn.next.del>0) parts.push(`${bn.next.del}% off delivery`);
      h+=`<div class="row"><small>💡 Add ${bn.next.buy-bn.n} more pair(s) to get ${parts.join(" + ")}!</small></div>`;
    }
  }
  box.innerHTML=h;
  document.getElementById("total").textContent="Total: ₹"+total();
  const gp=pairs(), needMore=gp>0 && gp<MIN_PAIRS;
  warn.style.display=needMore?"block":"none";
  warn.textContent=`Minimum ${MIN_PAIRS} pairs required to order guppies. You have ${gp} — please add ${MIN_PAIRS-gp} more pair(s).`;
  btn.disabled=needMore;
}
function sendOrder(){
  if(pairs()>0 && pairs()<MIN_PAIRS) return;
  const v=id=>document.getElementById(id).value.trim(), er=document.getElementById("cErr");
  const name=v("cName"), addr=v("cAddr"), phone=v("cPhone"), pin=v("cPin");
  let bad=null;
  if(name.length<2) bad=["cName","Please enter your name."];
  else if(addr.length<10) bad=["cAddr","Please enter your full address."];
  else if(!/^\d{10}$/.test(phone)) bad=["cPhone","Please enter a valid 10-digit phone number."];
  else if(!/^\d{6}$/.test(pin)) bad=["cPin","Please enter a valid 6-digit pincode."];
  if(bad){er.textContent=bad[1];er.style.display="block";document.getElementById(bad[0]).focus();return;}
  er.style.display="none";
  let msg = "Hello Shastha Guppy Farm, I would like to order:\n\n";
  if(comboCart){
    msg+=`🎉 *COMBO OFFER*\n${comboCart.title}\n`+(comboCart.timing?`Offer timing: ${comboCart.timing}\n`:"")+"Items:\n"+comboCart.lines.map(x=>`• ${x}`).join("\n")+`\nCombo price: ₹${comboCart.price}\n\n`;
    if(Object.keys(cart).length) msg+="*Other items*\n";
  }
  Object.entries(cart).forEach(([id,q])=>{const p=find(id); msg += `• ${p.name} – ${q} ${p.unit}${q>1?"s":""} (₹${unit(p)*q})\n`;});
  const fl=freeLines();
  if(fl){
    if(fl.hit.free>0) msg+=`\n🎁 *FREE (Buy ${fl.hit.buy} offer):*\n`+(fl.lines.length?fl.lines.map(x=>`• 1 pair – ${x}`).join("\n"):`• ${fl.hit.free} pair${fl.hit.free>1?"s":""} (chosen by the farm)`)+"\n";
    if(fl.hit.del>0) msg+=`\n🚚 *Delivery discount:* ${fl.hit.del}% off (₹${dcharge(fl.hit.del)} per kg instead of ₹${DELIVERY_CHARGE})\n`;
  }
  msg += `\nTotal: ₹${total()}\n\n*Customer details*\nName: ${name}\nAddress: ${addr}\nPhone: ${phone}\nPincode: ${pin}\n\nPlease confirm availability and delivery details.`;
  window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodeURIComponent(msg)}`,"_blank");
}

async function shrink(f){
  if(!f.type.startsWith("image/")||f.type==="image/gif"||f.type==="image/svg+xml") return f;
  try{
    const bmp=await createImageBitmap(f), sc=Math.min(1,1400/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const png=f.type==="image/png", blob=await new Promise(r=>c.toBlob(r,png?"image/png":"image/jpeg",.85));
    return blob?new File([blob],f.name.replace(/\.\w+$/,"")+(png?".png":".jpg"),{type:png?"image/png":"image/jpeg"}):f;
  }catch(e){return f;}
}
async function upload(f){
  f=await shrink(f);
  if(f.size>25*1024*1024) throw new Error(`This file is too big (${Math.round(f.size/1048576)} MB). Please choose one under 25 MB.`);
  const data=await new Promise(res=>{const r=new FileReader();r.onload=()=>res(r.result.split(",")[1]);r.readAsDataURL(f);});
  const path="media/"+Date.now()+"_"+f.name.replace(/[^\w.]/g,"_");
  const r=await gh(path,"PUT",{message:"Upload media",content:data});
  if(!r.ok)throw new Error((await r.json()).message);
  return path;
}
const enc=new TextEncoder(),dec=new TextDecoder();
const tob=a=>btoa(String.fromCharCode(...new Uint8Array(a))),fromb=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function keyFor(name,pw,salt){
  const m=await crypto.subtle.importKey("raw",enc.encode(name.trim().toLowerCase()+"|"+pw),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt,iterations:300000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}

async function doSetup(){
  const c={owner:g("so").value.trim(),repo:g("sr").value.trim(),token:g("st").value.trim()},n=g("sn").value,p=g("sp").value;
  if(!n.trim()||p.length<8){alert("Enter a name and a password of at least 8 characters (10 or more is better).");return;}
  try{
    const r=await fetch(`https://api.github.com/repos/${c.owner}/${c.repo}`,{headers:{Authorization:"Bearer "+c.token}});
    const j=r.ok?await r.json():null;
    if(!j||!j.permissions||!j.permissions.push){alert("GitHub check failed. Check the username, repository and token.");return;}
    const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:"AES-GCM",iv},await keyFor(n,p,salt),enc.encode(JSON.stringify({token:c.token})));
    const old=await gh("admin.json","GET",null,c),sha=old.ok?(await old.json()).sha:undefined;
    const w=await gh("admin.json","PUT",{message:"Admin setup",content:b64(JSON.stringify({owner:c.owner,repo:c.repo,salt:tob(salt),iv:tob(iv),data:tob(ct)})),sha},c);
    if(!w.ok){alert((await w.json()).message);return;}
    closeModal();toast("Setup done ✓ Wait 1 minute, then tap the logo 5 times to log in");
  }catch(e){alert(e.message);}
}

  <div id="oany"><input id="oc" type="number" placeholder="How many pairs (e.g. 3)" value="${o.count||3}"></div>
  <div id="olist"><p style="font-size:.85rem;margin:4px 0">Products included (type how many; 0 = not included):</p>${plist}
    <textarea id="oit" rows="3" placeholder="Other items / gifts (optional), one per line" style="margin-top:6px;padding:10px;border-radius:8px;border:none;font-size:1rem;width:100%">${esc(o.items)}</textarea></div>
  <div id="opct"><input id="opc" type="number" min="1" max="100" placeholder="Discount % (e.g. 10, 15, 100)" value="${o.pct||""}">
    <select id="osc" onchange="togOffer()" style="margin-top:8px">${scopeOpts}</select>
    <div id="opi"><p style="font-size:.85rem;margin:4px 0">Tick the items that get the discount:</p>${ilist}</div></div>
  <div id="ofree"><p style="font-size:.85rem;margin:4px 0">Customer must buy from:</p><select id="osf" onchange="togOffer()">${freeOpts}</select>
    <div id="obi"><p style="font-size:.85rem;margin:4px 0">Tick the items that count:</p>${bilist}</div>
    <p style="font-size:.85rem;margin:8px 0 4px">Offer levels (leave a row empty to skip it). Delivery % is optional. Open "Choose free gifts" in each level and tick the products you give free at that level:</p>${trows}</div>
  <div id="oprw"><input id="opr" type="number" placeholder="Combo price ₹" value="${o.price||""}"></div>
  <input id="ot" placeholder="Timing, e.g. Today 6 PM - 9 PM" value="${esc(o.timing)}">
  <label>Auto-hide after (optional):<input id="oe" type="datetime-local" value="${end}"></label>
  <div class="mrow"><button onclick="saveOffer()">Save</button><button class="back" onclick="closeModal()">Cancel</button></div>`);
  togOffer();
}
function togOffer(){
  const t=g("oty").value;
  g("oany").style.display=t==="any"?"block":"none";
  g("olist").style.display=t==="list"?"block":"none";
  g("opct").style.display=t==="pct"?"block":"none";
  g("ofree").style.display=t==="free"?"block":"none";
  g("obi").style.display=(t==="free"&&g("osf").value==="items")?"block":"none";
  g("oprw").style.display=(t==="pct"||t==="free")?"none":"block";
  g("opi").style.display=(t==="pct"&&g("osc").value==="items")?"block":"none";
}
async function saveOffer(){
  const e=g("oe").value,picks={},ids=[],tiers=[];
  document.querySelectorAll(".pk").forEach(i=>{const q=+i.value;if(q>0)picks[i.dataset.id]=q;});
  document.querySelectorAll(".pi").forEach(i=>{if(i.checked)ids.push(i.dataset.id);});
  const buyIds=[],giftIds=[];
  document.querySelectorAll(".bi").forEach(i=>{if(i.checked)buyIds.push(i.dataset.id);});

  const tf=document.querySelectorAll(".tf");
  const td=document.querySelectorAll(".td");
  document.querySelectorAll(".tb").forEach((i,k)=>{const b=+i.value,f=+tf[k].value||0,d=Math.min(100,Math.max(0,+td[k].value||0));const gifts=[...document.querySelectorAll('.gi[data-t="'+k+'"]')].filter(x=>x.checked).map(x=>x.dataset.id),gt=document.querySelector('.gt[data-t="'+k+'"]');if(b>0&&(f>0||d>0))tiers.push({buy:b,free:f,del:d,gifts,text:gt?gt.value:""});});
  const type=g("oty").value,pct=+g("opc").value;
  if(type==="pct"&&(!(pct>0)||pct>100)){alert("Enter a discount between 1 and 100");return;}
  if(type==="free"&&!tiers.length){alert("Fill at least one row: Buy N pairs, then free pairs and/or delivery % off");return;}
  OFFER={active:g("oa").checked,type,count:+g("oc").value||3,price:+g("opr").value,title:g("oti").value.trim(),picks,items:g("oit").value,pct,tiers,buyIds,scope:type==="free"?g("osf").value:g("osc").value,ids,timing:g("ot").value.trim(),ends_at:e?new Date(e).toISOString():null};
  try{await saveAll();}catch(x){alert(x.message);}closeModal();refresh();
}
setInterval(renderOffer,60000);
window.addEventListener("hashchange",()=>{if(location.hash==="#admin")openLogin();if(location.hash==="#setup")openSetup();});
renderCats();
(async()=>{
  await loadPublic();
  if(cfg()&&cfg().token){setAdmin(true);loadFromGH();}
  if(location.hash==="#admin")openLogin();
  if(location.hash==="#setup")openSetup();
})();
</script>
</body>
</html>
